---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: artifactnodes.artifact.falcosecurity.dev
spec:
  group: artifact.falcosecurity.dev
  names:
    categories:
    - artifacts
    kind: ArtifactNode
    listKind: ArtifactNodeList
    plural: artifactnodes
    singular: artifactnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['artifact\.falcosecurity\.dev/kind']
      name: Kind
      type: string
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.conditions[?(@.type=='Programmed')].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ArtifactNode tracks the per-node state of an artifact (Plugin, Rulesfile, or Config).
          One ArtifactNode is created per cluster node that matches the parent artifact selector.
          It is written exclusively by the artifact operator running on that node.
          The artifact kind is stored in the label artifact.falcosecurity.dev/kind.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is required, so the apiserver also enforces NodeName's
              own required constraint within it.
            properties:
              nodeName:
                description: NodeName is the name of the node to which this artifact
                  is assigned.
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
            required:
            - nodeName
            type: object
          status:
            default:
              conditions:
              - lastTransitionTime: "1970-01-01T00:00:00Z"
                message: Waiting for controller
                reason: Pending
                status: Unknown
                type: Programmed
            description: ArtifactNodeStatus defines the per-node observed state of
              an artifact.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of this node's artifact state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installedArtifacts:
                description: |-
                  InstalledArtifacts tracks the artifact files currently written to disk by this node's operator.
                  Each entry corresponds to one source medium (oci, inline, configmap).
                items:
                  description: |-
                    InstalledArtifact describes a single artifact file currently on disk.
                    The medium field is the list map key: at most one entry per medium exists.
                  properties:
                    config:
                      description: |-
                        Config tracks the generated configuration file derived from this artifact.
                        Populated only for Plugin artifacts (the plugins-config-inline.yaml shared config file).
                        Binary and config share the same lifecycle: no binary means no config, and vice versa.
                      properties:
                        path:
                          description: Path is the absolute on-disk path of the generated
                            config file.
                          type: string
                      required:
                      - path
                      type: object
                    contentHash:
                      description: |-
                        ContentHash is the SHA-256 hex digest of the bytes written to disk.
                        A mismatch between this value and the current source signals that the file must be re-written.
                      type: string
                    medium:
                      description: 'Medium identifies the source: "oci", "inline",
                        or "configmap".'
                      enum:
                      - oci
                      - inline
                      - configmap
                      type: string
                    path:
                      description: Path is the absolute on-disk path of the installed
                        file.
                      type: string
                    priority:
                      description: Priority is the load-order value encoded in the
                        filename.
                      format: int32
                      type: integer
                    specHash:
                      description: |-
                        SpecHash is the SHA-256 hash of the parent artifact's OCIArtifact spec at the time this
                        artifact was installed. Populated only for MediumOCI. A mismatch with the parent
                        artifact's current ArtifactMeta.SpecHash means the remote blob may have changed and the
                        artifact must be re-fetched regardless of disk integrity.
                      type: string
                  required:
                  - contentHash
                  - medium
                  - path
                  - priority
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - medium
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
