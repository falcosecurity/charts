apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "falco-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-operator.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: falco
    control-plane: falco-operator
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "falco-operator.selectorLabels" . | nindent 6 }}
      control-plane: falco-operator
      app.kubernetes.io/part-of: falco
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "falco-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/part-of: falco
        control-plane: falco-operator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "falco-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          command:
            - /usr/bin/manager
          args:
            - --health-probe-bind-address=:8081
            {{- range .Values.excludedLabels }}
            - --excluded-labels={{ . }}
            {{- end }}
            {{- if .Values.mtls.enabled }}
            - --artifact-server-cert-path=/etc/artifact-server-certs
            - --artifact-server-client-ca-file=/etc/artifact-server-trust/ca-bundle.crt
            - --artifact-client-cert-issuer-name={{ include "falco-operator.mtlsIssuerName" . }}
            - --artifact-client-cert-duration={{ .Values.mtls.client.certDuration }}
            - --artifact-client-cert-renew-before={{ .Values.mtls.client.certRenewBefore }}
            - --artifact-ca-bundle-configmap-name={{ include "falco-operator.mtlsCABundleConfigMapName" . }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: artifact-server
              containerPort: 8082
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: artifact-cache
              mountPath: /var/cache/falco-operator/artifacts
            {{- if .Values.mtls.enabled }}
            - name: artifact-server-certs
              mountPath: /etc/artifact-server-certs
              readOnly: true
            - name: artifact-server-trust
              mountPath: /etc/artifact-server-trust
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: artifact-cache
          emptyDir: {}
        {{- if .Values.mtls.enabled }}
        - name: artifact-server-certs
          secret:
            secretName: {{ include "falco-operator.fullname" . }}-artifact-server-tls
        - name: artifact-server-trust
          configMap:
            name: {{ include "falco-operator.mtlsCABundleConfigMapName" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
