# Default values for falco-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the operator. Leader election is OFF by default;
# to run more than 1 replica, also set `extraArgs: ["--leader-elect=true"]`.
replicaCount: 1

# -- The number of old ReplicaSets to retain to allow rollback
revisionHistoryLimit: 10

image:
  # -- Repository for the Falco Operator image
  repository: falcosecurity/falco-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""
  # -- Optional image digest (e.g. sha256:abc...). When set, takes precedence over tag and renders repository@digest.
  digest: ""

# -- Registry host[:port][/path] for the default Docker Hub images of the operator and generated workloads. Preserves tags/digests; custom repositories and explicit images take precedence.
imageRegistry: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Name override for the chart
nameOverride: ""
# -- Full name override for the chart
fullnameOverride: ""

# -- Cluster DNS domain, used for the artifact server URL and its TLS certificate.
clusterDomain: cluster.local

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount the ServiceAccount API token into pods using this ServiceAccount
  automountServiceAccountToken: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""
  # -- Image pull secrets attached to the service account
  imagePullSecrets: []

# -- RBAC configuration
rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- mTLS for the central artifact server and per-Falco-instance client certificates. Requires
# cert-manager installed in the cluster (and trust-manager too, if mtls.createIssuer is true).
# See internal/pkg/artifactserver and controllers/instance/falco for the Go side.
mtls:
  # -- Enable mTLS. When true: cert-manager issues this Deployment's own server certificate,
  # the Falco controller creates a unique per-instance client certificate (with a SPIFFE URI
  # SAN identifying the instance) for every Falco instance's artifact-operator sidecar, and the
  # operator's ClusterRole gains permission to create cert-manager Certificate objects. When
  # false (the default), the artifact server runs over plain HTTP without application-level
  # authentication or namespace authorization, and has no cert-manager dependency. Mesh mTLS
  # alone does not enable these checks; restrict access with network/mesh authorization policies.
  enabled: false

  # -- If true, this chart bootstraps its own private CA (a self-signed Issuer, a CA
  # Certificate, and a ClusterIssuer) and a trust-manager Bundle that distributes that CA to any
  # namespace labeled trustLabel below. The CA Secret lives in the release namespace, which must
  # match cert-manager's --cluster-resource-namespace and trust-manager's app.trust.namespace.
  # These are shared controller settings: do not change them blindly on an existing PKI.
  # If false, set issuerName to an existing ClusterIssuer you manage yourself, and distribute
  # trust to BOTH the operator and Falco namespaces (this chart creates no Bundle in that mode).
  # See docs/installation.md for onboarding and issuance-policy requirements.
  createIssuer: true

  # -- Name of the ClusterIssuer used to sign the server and per-instance client certificates.
  # Defaults to "<fullname>-artifact-ca-issuer", the one this chart creates when createIssuer is
  # true. Set this explicitly when createIssuer is false, to reference your own ClusterIssuer.
  issuerName: ""

  # -- Name of the ConfigMap (synced by trust-manager into every trust-labeled namespace) that
  # both the operator's Deployment and every Falco instance's sidecar read to verify their peer's
  # certificate through a CA rotation. Deliberately not each side's own per-instance Secret,
  # since a Secret's bundled ca.crt only ever reflects one CA at a time, but this ConfigMap can
  # hold two at once during a coordinated rotation. Defaults to
  # "<fullname>-artifact-ca-bundle", the Bundle this chart creates when createIssuer is true.
  # Set this explicitly when createIssuer is false, to reference your own trust-distribution
  # mechanism's ConfigMap.
  caBundleConfigMapName: ""

  # -- Label applied to namespaces that should receive the CA trust bundle via trust-manager
  # (only relevant when createIssuer is true). A cluster admin must label BOTH the operator's
  # namespace and every Falco namespace with this key=true before mTLS setup; this chart never
  # labels namespaces on its own (a deliberate, explicit, admin-approves-trust step). Without it,
  # the operator or a Falco sidecar has no CA bundle ConfigMap to mount and its pod will sit stuck in
  # ContainerCreating.
  trustLabel: artifact.falcosecurity.dev/trust

  # -- Duration for the bootstrap CA certificate (only used when createIssuer is true).
  # cert-manager renews it automatically, reusing its private key (rotationPolicy: Never)
  # so existing leaf certificates remain trusted. CA key rotation requires coordinated
  # trust-bundle and leaf-certificate updates, which this chart does not automate.
  caCertDuration: 8760h

  server:
    # -- Duration/renewBefore for the artifact server's own leaf certificate.
    certDuration: 720h
    certRenewBefore: 168h

  client:
    # -- Duration/renewBefore for each Falco instance's per-instance client certificate.
    certDuration: 720h
    certRenewBefore: 168h

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 128Mi

# -- In-place pod resize policy for the manager container
resizePolicy: []
  # - resourceName: cpu
  #   restartPolicy: NotRequired
  # - resourceName: memory
  #   restartPolicy: RestartContainer

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 15
  periodSeconds: 20

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Additional volumes. mTLS's own volumes (server cert Secret + CA trust bundle ConfigMap) are
# added natively when mtls.enabled is true; no need to list them here.
volumes: []

# -- Additional volume mounts. See the volumes note above.
volumeMounts: []

# -- Label keys that must NOT be propagated onto operator-generated resources.
# Supports the '*' wildcard (e.g. `kustomize.toolkit.fluxcd.io/*`).
excludedLabels: []
  # - argocd.argoproj.io/instance
  # - kustomize.toolkit.fluxcd.io/name
  # - kustomize.toolkit.fluxcd.io/namespace

# -- When false, the artifact-operator sidecar installs artifacts regardless of Falco version
# or plugin dependency constraints. Useful when compatibility metadata is unavailable or incorrect.
enforceRequirements: true

# -- When true, the artifact-operator sidecar runs with the Unconfined AppArmor profile. Enable on nodes
# where the container runtime's default AppArmor profile blocks SIGHUP to Falco with permission denied.
# Requires Kubernetes 1.30 or later. Enabling it rolls the Falco pods.
artifactOperatorAppArmorUnconfined: false

# -- Additional CLI arguments passed to the operator binary. mTLS's own flags are added
# natively when mtls.enabled is true; no need to list them here.
extraArgs: []
  # - --metrics-bind-address=:8443
  # - --metrics-secure=false

# -- Extra environment variables
extraEnv: []
  # - name: ARTIFACT_DOWNLOAD_TIMEOUT
  #   value: "2m"

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: falco-operator

# -- Priority class name
priorityClassName: ""

# -- Pod DNS policy. One of ClusterFirst, ClusterFirstWithHostNet, Default or None.
dnsPolicy: ""

# -- Pod DNS config. Requires dnsPolicy to be set to None to take full effect.
dnsConfig: {}
  # nameservers:
  #   - 1.1.1.1
  # searches:
  #   - ns.svc.cluster.local
  # options:
  #   - name: ndots
  #     value: "2"

# API Priority and Fairness for the artifact API (flowcontrol.apiserver.k8s.io/v1, Kubernetes 1.29+). Off by
# default: installing it needs permission to create cluster-scoped flow-control objects. In a large cluster it puts
# the artifact-operator sidecars, one per node, in a bounded priority level, so that a burst of their requests
# queues instead of competing with the rest of the cluster, while the operator's own requests keep their priority.
apiPriorityAndFairness:
  # -- Create the PriorityLevelConfiguration and FlowSchemas.
  enabled: false
  artifactOperators:
    # -- FlowSchema precedence: lower matches first. Above the cluster's catch-all, below system schemas.
    matchingPrecedence: 1000
    # -- Share of the API server's concurrency the sidecars are entitled to.
    nominalConcurrencyShares: 20
    # -- Part of that share other levels may borrow while the sidecars do not use it.
    lendablePercent: 50
    # -- Queues requests wait in once the level is busy; more queues isolate Falco instances better.
    queues: 64
    # -- Queues each Falco instance's requests are spread over (shuffle sharding).
    handSize: 6
    # -- Requests a queue holds before further ones are rejected with 429.
    queueLengthLimit: 50
    # -- Namespaces of the Falco instances, whose ServiceAccounts are the sidecars'. Empty matches the
    # ServiceAccounts of every namespace, so any other workload using the artifact API shares the sidecars' level.
    namespaces: []
  operator:
    # -- Precedence of the operator's own schema; it must match before the sidecars' one.
    matchingPrecedence: 900
    # -- Priority level for the operator's own artifact API requests.
    priorityLevel: workload-high

# Admission policy for ArtifactNodes (admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy, Kubernetes 1.30+).
# Off by default: installing it needs permission to create cluster-scoped admission objects. The artifact-operator
# sidecars of one Falco instance share a ServiceAccount, whose Role lets each of them patch every ArtifactNode of
# the namespace. With the policy, a sidecar can only change the ArtifactNode of the node it runs on, and never
# its spec, so a compromised node cannot take the rules away from the others. It relies on the node name the API
# server puts in a pod's ServiceAccount token (ServiceAccountTokenPodNodeInfo, on by default since Kubernetes
# 1.30): a request without it is not restricted.
artifactNodeAdmissionPolicy:
  # -- Create the ValidatingAdmissionPolicy and its binding.
  enabled: false

# -- Array of extra Kubernetes manifests to deploy alongside the operator. Each
# entry is rendered with `tpl`, so Helm templating (e.g. `{{ .Release.Name }}`)
# is supported within values. mTLS's own cert-manager/trust-manager resources are templated
# natively (see mtls.* above and templates/mtls.yaml); this is for anything else.
extraObjects: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: '{{ include "falco-operator.fullname" . }}-extra'
  #     namespace: '{{ .Release.Namespace }}'
  #   data:
  #     example: "value"
