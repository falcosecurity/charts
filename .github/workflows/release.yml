name: Release Charts

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Add dependency chart repos
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          config: cr.yaml
          # "Latest" and pre-release status are decided per chart in the
          # "Publish and Sign OCI Charts" step below, from each package's own
          # metadata rather than a guess about what this push touched.
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Sign OCI Charts
        run: |
          set -o pipefail
          overall_failed=false

          # A plain glob, not `find`, so every "${chart}" expansion below stays
          # a single well-formed word with no quoting/splitting edge cases.
          for chart in .cr-release-packages/*.tgz; do
            [[ -e "${chart}" ]] || continue

            # Read name/version from the package's own Chart.yaml via `yq`
            if ! chart_meta=$(helm show chart "${chart}"); then
              echo "::error::helm show chart failed for ${chart}, skipping"
              overall_failed=true
              continue
            fi
            read -r chart_name chart_version <<< "$(yq -r '.name + " " + .version' <<< "${chart_meta}")"
            if [[ -z "${chart_name}" || -z "${chart_version}" ]]; then
              echo "::error::could not read chart name/version from ${chart}, skipping"
              overall_failed=true
              continue
            fi

            if ! helm push "${chart}" "oci://ghcr.io/${GITHUB_REPOSITORY}" |& tee helm-push-output.log; then
              echo "::error::helm push failed for ${chart}, skipping"
              overall_failed=true
              continue
            fi
            digest=$(awk -F "[, ]+" '/Digest/{print $NF}' < helm-push-output.log)

            if ! cosign sign "ghcr.io/${GITHUB_REPOSITORY}/${chart_name}@${digest}"; then
              echo "::error::cosign sign failed for ${chart_name}@${digest}, skipping"
              overall_failed=true
              continue
            fi

            # chart-releaser has no native way to flag a GitHub release as a
            # pre-release (see helm/chart-releaser#579), and mark_as_latest is
            # disabled repo-wide above, so both are set here per chart instead.
            release_tag="${chart_name}-${chart_version}"
            if [[ "${chart_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
              gh_flags=(--prerelease --latest=false)
            else
              gh_flags=(--latest)
            fi
            if ! gh release edit "${release_tag}" "${gh_flags[@]}" --repo "${GITHUB_REPOSITORY}"; then
              echo "::error::gh release edit failed for ${release_tag}"
              overall_failed=true
            fi
          done

          if [[ "${overall_failed}" == true ]]; then
            echo "::error::one or more charts failed to publish, sign, or have their release annotated; see above"
            exit 1
          fi
        env:
          COSIGN_YES: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
